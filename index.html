<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --blue: #2563eb;
    --blue-light: #c7d7fb;
    --blue-tint: #f3f7ff;
    --text: #111827;
    --sub: #6b7280;
    --faint: #9ca3af;
    --line: #e9ecf1;
    --track: #f1f3f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #fff;
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum";
    line-height: 1.45;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 24px 56px; }

  /* 상단 제목 */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
  .updated { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .btn {
    flex-shrink: 0; border: 1px solid var(--line); background: #fff; color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .notice {
    display: none; border: 1px solid var(--line); background: #fafbfc; border-radius: 12px;
    padding: 14px 16px; font-size: 14px; margin-bottom: 14px;
  }
  .notice .msg { margin-top: 6px; font-size: 12px; color: var(--sub); word-break: break-all; }

  /* 카드 4개 */
  .cards { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card, .panel { border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; background: #fff; }
  .card.main { background: var(--blue-tint); border-color: #dfe8fd; }
  .card-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--sub); }
  .tag { font-size: 11px; font-weight: 700; color: var(--blue); background: #fff; border: 1px solid #dfe8fd; padding: 1px 8px; border-radius: 999px; }
  .card-value {
    font-size: 26px; font-weight: 700; letter-spacing: -0.03em; margin-top: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card.main .card-value { font-size: 42px; line-height: 1.15; color: var(--blue); margin-top: 8px; }
  .card-sub { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .card-sub b { color: var(--text); font-weight: 600; }
  .card-sub b.blue { color: var(--blue); }
  .progress { height: 8px; background: #fff; border-radius: 999px; overflow: hidden; margin-top: 16px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .8s ease; }
  .progress-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--sub); }
  .progress-row b { color: var(--blue); font-weight: 700; }

  /* 패널 */
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row.top { grid-template-columns: 3fr 2fr; }
  .row.bottom { grid-template-columns: 1fr 1fr; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg-box { width: 10px; height: 10px; border-radius: 3px; background: var(--blue-light); }
  .lg-box.dark { background: var(--blue); }
  .lg-line { width: 16px; border-top: 2px dashed #4b5563; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .placeholder { color: var(--faint); font-size: 14px; padding: 40px 0; text-align: center; }

  /* 깔때기 */
  .funnel { display: grid; grid-template-columns: fit-content(120px) 1fr auto; column-gap: 12px; align-items: center; }
  .f-name { font-size: 13px; font-weight: 600; }
  .f-bar-wrap { display: flex; justify-content: center; }
  .f-bar { height: 34px; border-radius: 8px; background: var(--blue-light); }
  .f-bar.last { background: var(--blue); }
  .f-count { font-size: 14px; font-weight: 700; text-align: right; white-space: nowrap; }
  .f-conv { grid-column: 2; text-align: center; font-size: 12px; color: var(--sub); padding: 5px 0; }
  .f-conv b { color: var(--text); font-weight: 600; }
  .final {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--blue-tint);
  }
  .final-label { font-size: 13px; font-weight: 700; }
  .final-sub { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .final-value { font-size: 28px; font-weight: 800; color: var(--blue); letter-spacing: -0.03em; white-space: nowrap; }

  /* 순위 */
  .rank { list-style: none; display: grid; gap: 14px; }
  .rank-top { display: flex; align-items: center; gap: 10px; }
  .rank-no {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--sub); background: var(--track);
  }
  .rank-no.first { background: var(--blue); color: #fff; }
  .rank-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-amt { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .rank-track { height: 8px; border-radius: 999px; background: var(--track); margin: 8px 0 0 32px; overflow: hidden; }
  .rank-track span { display: block; height: 100%; border-radius: 999px; background: var(--blue-light); }
  .rank li:first-child .rank-track span { background: var(--blue); }

  /* 화면 크기별 */
  @media (max-width: 960px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .card.main { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .row.top, .row.bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 40px; }
    h1 { font-size: 20px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .card.target { grid-column: 1 / -1; }
    .row { gap: 10px; margin-bottom: 10px; }
    .card, .panel { padding: 16px; border-radius: 14px; }
    .card-value { font-size: 21px; }
    .card.main .card-value { font-size: 34px; }
    .final-value { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress span { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>영업 대시보드</h1>
      <p class="updated" id="updated">데이터 불러오는 중…</p>
    </div>
    <button class="btn" id="refresh" type="button">새로고침</button>
  </header>

  <div class="notice" id="notice"></div>

  <!-- 1. 카드 4개 -->
  <section class="cards">
    <div class="card main">
      <div class="card-label">이번 달 매출 <span class="tag" id="curMonth">–</span></div>
      <div class="card-value" id="revenue">–</div>
      <div class="progress"><span id="rateBar"></span></div>
      <div class="progress-row"><span>목표 대비 달성률</span><b id="rateText">–</b></div>
    </div>
    <div class="card target">
      <div class="card-label">이번 달 목표</div>
      <div class="card-value" id="target">–</div>
      <div class="card-sub" id="remain">&nbsp;</div>
    </div>
    <div class="card">
      <div class="card-label">객단가</div>
      <div class="card-value" id="aov">–</div>
      <div class="card-sub" id="aovSub">&nbsp;</div>
    </div>
    <div class="card">
      <div class="card-label">계약 건수</div>
      <div class="card-value" id="contracts">–</div>
      <div class="card-sub" id="contractsSub">&nbsp;</div>
    </div>
  </section>

  <!-- 2, 3. 월별 매출 / 영업 단계 -->
  <section class="row top">
    <div class="panel">
      <div class="panel-head">
        <h2>월별 매출</h2>
        <div class="legend">
          <span><i class="lg-box dark"></i>이번 달</span>
          <span><i class="lg-box"></i>지난 달</span>
          <span><i class="lg-line"></i>목표</span>
        </div>
      </div>
      <div class="chart" id="monthly"><div class="placeholder">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>영업 단계</h2></div>
      <div id="funnel"><div class="placeholder">불러오는 중…</div></div>
    </div>
  </section>

  <!-- 4, 5. 순위 -->
  <section class="row bottom">
    <div class="panel">
      <div class="panel-head"><h2>담당자별 순위</h2></div>
      <div id="rankPerson"><div class="placeholder">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>상품별 순위</h2></div>
      <div id="rankProduct"><div class="placeholder">불러오는 중…</div></div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ================= 연결 정보 =================
  const SUPABASE_URL = 'https://rslrkmfbywfmednotfta.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzbHJrbWZieXdmbWVkbm90ZnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NjQ2MTksImV4cCI6MjEwNjM0MDYxOX0.9rv7w5HVHo0PymE48kwoyjTsqpC2xmXJB5u5E0ic7Ps';

  // ================= 금액 단위 =================
  // DB에 들어있는 금액이 '원' 단위면 1, '천원' 단위면 1000, '만원' 단위면 10000
  const MONEY_UNIT = 1;

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ================= 공통 도구 =================
  const BLUE = '#2563eb';
  const BLUE_LIGHT = '#c7d7fb';
  const state = { monthly: [], pipeline: [], rank: [] };

  const $ = (id) => document.getElementById(id);
  const num = (v) => Number(v) || 0;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const trimZero = (s) => (s.includes('.') ? s.replace(/\.?0+$/, '') : s);
  const placeholder = (t) => `<div class="placeholder">${t || '표시할 데이터가 없어요'}</div>`;

  // 짧은 금액: 3,450만 / 1.25억
  function money(v) {
    const w = num(v) * MONEY_UNIT;
    const a = Math.abs(w);
    if (a >= 1e8) return trimZero((w / 1e8).toFixed(a >= 1e10 ? 0 : a >= 1e9 ? 1 : 2)) + '억';
    if (a >= 1e4) return Math.round(w / 1e4).toLocaleString('ko-KR') + '만';
    return Math.round(w).toLocaleString('ko-KR');
  }
  const won = (v) => money(v) + '원';
  const fullWon = (v) => Math.round(num(v) * MONEY_UNIT).toLocaleString('ko-KR') + '원';
  const pct = (a, b) => (b ? trimZero((a / b * 100).toFixed(1)) + '%' : '-');

  // '2026-09', '9', '9월' 등을 '9월'로
  function monthLabel(m) {
    const s = String(m ?? '').trim();
    const ym = s.match(/^(\d{4})[-./](\d{1,2})/);
    if (ym) return Number(ym[2]) + '월';
    if (/^\d{1,2}$/.test(s)) return Number(s) + '월';
    return s;
  }

  // ================= 데이터 불러오기 =================
  async function load() {
    const btn = $('refresh');
    btn.disabled = true;
    hideNotice();
    try {
      const [m, p, r] = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('*')
      ]);
      const err = m.error || p.error || r.error;
      if (err) throw err;

      state.monthly = (m.data || []).map((d) => ({ month: d.month, revenue: num(d.revenue), target: num(d.target) }));
      state.pipeline = (p.data || []).map((d) => ({ stage: d.stage, count: num(d.count) }));
      state.rank = (r.data || []).map((d) => ({ kind: String(d.kind || '').trim().toLowerCase(), name: d.name, amount: num(d.amount) }));

      renderAll();
      $('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

      if (!state.monthly.length && !state.pipeline.length && !state.rank.length) {
        showNotice('가져온 데이터가 없어요.', '테이블에 데이터가 있는데도 이렇게 보이면, Supabase에서 세 테이블에 읽기(SELECT) 허용 정책(RLS)이 있는지 확인해 주세요.');
      }
    } catch (e) {
      $('updated').textContent = '불러오기 실패';
      showNotice('데이터를 불러오지 못했어요.', 'Supabase 주소와 키, 테이블 이름, 읽기 권한(RLS)을 확인해 주세요.<div class="msg">' + esc(e && e.message ? e.message : e) + '</div>');
    } finally {
      btn.disabled = false;
    }
  }

  function showNotice(title, body) {
    const n = $('notice');
    n.innerHTML = `<b>${title}</b><br>${body}`;
    n.style.display = 'block';
  }
  function hideNotice() { $('notice').style.display = 'none'; }

  function renderAll() {
    renderCards();
    renderMonthly();
    renderFunnel();
    renderRank('rankPerson', 'person');
    renderRank('rankProduct', 'product');
  }

  // ================= 1. 카드 =================
  function renderCards() {
    const m = state.monthly, p = state.pipeline;
    const cur = m[m.length - 1];
    const last = p[p.length - 1];
    const contracts = last ? last.count : 0;

    $('contracts').textContent = last ? contracts.toLocaleString('ko-KR') + '건' : '–';
    $('contractsSub').textContent = last ? `마지막 단계 '${last.stage}' 기준` : '영업 단계 데이터 없음';

    if (!cur) {
      ['revenue', 'target', 'aov', 'rateText', 'curMonth'].forEach((id) => ($(id).textContent = '–'));
      $('remain').textContent = '월별 매출 데이터 없음';
      $('aovSub').innerHTML = '&nbsp;';
      $('rateBar').style.width = '0';
      return;
    }

    $('curMonth').textContent = monthLabel(cur.month);
    $('revenue').textContent = won(cur.revenue);
    $('revenue').title = fullWon(cur.revenue);
    $('rateText').textContent = pct(cur.revenue, cur.target);
    $('rateBar').style.width = (cur.target ? Math.min(cur.revenue / cur.target * 100, 100) : 0) + '%';

    $('target').textContent = won(cur.target);
    $('target').title = fullWon(cur.target);
    const remain = cur.target - cur.revenue;
    $('remain').innerHTML = remain > 0
      ? `남은 금액 <b>${won(remain)}</b>`
      : `<b class="blue">목표 달성</b>${remain < 0 ? ` · ${won(-remain)} 초과` : ''}`;

    $('aov').textContent = contracts ? won(cur.revenue / contracts) : '–';
    $('aovSub').textContent = `매출 ÷ 계약 ${contracts.toLocaleString('ko-KR')}건`;
  }

  // ================= 2. 월별 매출 막대그래프 =================
  function niceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }

  let chartWidth = 0;
  function renderMonthly() {
    const box = $('monthly');
    const rows = state.monthly;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const W = Math.max(box.clientWidth, 260);
    chartWidth = box.clientWidth;
    const H = W < 480 ? 230 : 320;
    const pad = { top: 26, right: 4, bottom: 30, left: 50 };
    const iw = W - pad.left - pad.right;
    const ih = H - pad.top - pad.bottom;

    // 세로축: 가장 큰 값보다 살짝 높은 깔끔한 숫자로
    const maxVal = Math.max(...rows.map((r) => Math.max(r.revenue, r.target)), 1) * 1.08;
    let step = 0, ticks = 4;
    [4, 5, 3].forEach((t) => {
      const st = niceStep(maxVal / t);
      if (!step || st * t < step * ticks) { step = st; ticks = t; }
    });
    const yMax = step * ticks;
    const y = (v) => pad.top + ih - (v / yMax) * ih;

    const n = rows.length;
    const slot = iw / n;
    const bw = Math.min(slot * 0.58, 46);
    const lastIdx = n - 1;
    const showAllValues = slot >= 54;
    const labelEvery = Math.max(1, Math.ceil(30 / slot));

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 매출 막대그래프">`;

    // 가로 눈금선
    for (let i = 0; i <= ticks; i++) {
      const v = step * i, yy = y(v);
      s += `<line x1="${pad.left}" x2="${W - pad.right}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? '#d9dde3' : '#f0f2f5'}"/>`;
      s += `<text x="${pad.left - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9ca3af">${money(v)}</text>`;
    }

    const cxOf = (i) => pad.left + slot * i + slot / 2;

    // 막대 + 월 이름
    rows.forEach((r, i) => {
      const cx = cxOf(i);
      const top = y(r.revenue);
      const isCur = i === lastIdx;
      const tip = `${esc(monthLabel(r.month))} 매출 ${fullWon(r.revenue)} / 목표 ${fullWon(r.target)} (${pct(r.revenue, r.target)})`;
      s += `<path d="${barPath(cx - bw / 2, top, bw, pad.top + ih - top, 5)}" fill="${isCur ? BLUE : BLUE_LIGHT}"><title>${tip}</title></path>`;
      if ((lastIdx - i) % labelEvery === 0) {
        s += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="12" font-weight="${isCur ? 700 : 400}" fill="${isCur ? '#111827' : '#6b7280'}">${esc(monthLabel(r.month))}</text>`;
      }
    });

    // 목표 점선 (같은 목표가 이어지는 달은 한 줄로)
    let i = 0;
    while (i < n) {
      let j = i;
      while (j + 1 < n && rows[j + 1].target === rows[i].target) j++;
      const t = rows[i].target;
      if (t > 0) {
        const yy = y(t);
        s += `<line x1="${pad.left + slot * i}" x2="${pad.left + slot * (j + 1)}" y1="${yy}" y2="${yy}" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"><title>목표 ${fullWon(t)}</title></line>`;
      }
      i = j + 1;
    }

    // 막대 위 금액 (점선 위에 겹쳐도 읽히도록 흰 테두리)
    rows.forEach((r, i) => {
      const isCur = i === lastIdx;
      if (!showAllValues && !isCur) return;
      s += `<text x="${cxOf(i)}" y="${y(r.revenue) - 8}" text-anchor="middle" font-size="11" font-weight="${isCur ? 700 : 500}" fill="${isCur ? BLUE : '#6b7280'}" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${money(r.revenue)}</text>`;
    });

    s += '</svg>';
    box.innerHTML = s;
  }

  // ================= 3. 영업 단계 깔때기 =================
  function renderFunnel() {
    const box = $('funnel');
    const rows = state.pipeline;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const first = rows[0], last = rows[rows.length - 1];
    const max = Math.max(...rows.map((r) => r.count), 1);
    let h = '<div class="funnel">';
    rows.forEach((r, i) => {
      const gridRow = i * 2 + 1;
      if (i > 0) {
        h += `<div class="f-conv" style="grid-row:${gridRow - 1}">↓ 전환 <b>${pct(r.count, rows[i - 1].count)}</b></div>`;
      }
      const w = Math.max(r.count / max * 100, 4);
      h += `<div class="f-name" style="grid-row:${gridRow};grid-column:1">${esc(r.stage)}</div>`;
      h += `<div class="f-bar-wrap" style="grid-row:${gridRow};grid-column:2"><div class="f-bar${i === rows.length - 1 ? ' last' : ''}" style="width:${w}%"></div></div>`;
      h += `<div class="f-count" style="grid-row:${gridRow};grid-column:3">${r.count.toLocaleString('ko-KR')}건</div>`;
    });
    h += '</div>';
    h += `
      <div class="final">
        <div>
          <div class="final-label">최종 전환율</div>
          <div class="final-sub">${esc(last.stage)} ${last.count.toLocaleString('ko-KR')}건 ÷ ${esc(first.stage)} ${first.count.toLocaleString('ko-KR')}건</div>
        </div>
        <div class="final-value">${pct(last.count, first.count)}</div>
      </div>`;
    box.innerHTML = h;
  }

  // ================= 4, 5. 순위 =================
  function renderRank(id, kind) {
    const box = $(id);
    const rows = state.rank.filter((r) => r.kind === kind).sort((a, b) => b.amount - a.amount);
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const max = Math.max(rows[0].amount, 1);
    box.innerHTML = '<ol class="rank">' + rows.map((r, i) => `
      <li>
        <div class="rank-top">
          <span class="rank-no${i === 0 ? ' first' : ''}">${i + 1}</span>
          <span class="rank-name">${esc(r.name)}</span>
          <span class="rank-amt" title="${fullWon(r.amount)}">${won(r.amount)}</span>
        </div>
        <div class="rank-track"><span style="width:${Math.max(r.amount / max * 100, 2)}%"></span></div>
      </li>`).join('') + '</ol>';
  }

  // ================= 시작 =================
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.monthly.length && $('monthly').clientWidth !== chartWidth) renderMonthly();
    }, 150);
  });
  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
