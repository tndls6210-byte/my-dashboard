<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABOS 영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ================= ABOS 로고에서 뽑은 색 ================= */
  :root {
    --ink: #1b1e22;          /* 로고 배경 차콜 */
    --steel-dark: #4b5259;   /* 진한 철제 회색 */
    --silver: #c9ced4;       /* 로고 은색 판 */
    --orange: #ff4500;       /* 로고 화살표 오렌지 */
    --orange-text: #d63a00;  /* 흰 바탕 위 오렌지 글씨 (읽기 쉽게 조금 진하게) */
    --page: #f3f4f6;
    --text: #1b1e22;
    --sub: #6b7178;
    --faint: #9aa0a6;
    --line: #e3e6ea;
    --track: #eceef1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum";
    line-height: 1.45;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 상단 브랜드 바 ================= */
  .topbar { background: var(--ink); border-bottom: 3px solid var(--orange); color: #fff; }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 42px; height: 42px; display: block; flex-shrink: 0; border-radius: 2px; }
  .brand-name { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; line-height: 1; }
  .brand-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: #b9c1ca; margin-top: 6px; white-space: nowrap; }
  .btn {
    flex-shrink: 0; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff;
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover { border-color: var(--orange); background: rgba(255,69,0,.14); }
  .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 56px; }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 12px; margin: 28px 0 18px;
  }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .updated { font-size: 13px; color: var(--sub); }

  .notice {
    display: none; border: 1px solid var(--line); border-left: 3px solid var(--orange);
    background: #fff; border-radius: 8px; padding: 14px 16px; font-size: 14px; margin-bottom: 14px;
  }
  .notice .line { margin-top: 8px; }
  .notice .msg { margin-top: 2px; font-size: 12px; color: var(--sub); word-break: break-all; }

  /* ================= 카드 4개 ================= */
  .cards { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card, .panel { border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; background: #fff; }
  .card-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--sub); }
  .card-value {
    font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-top: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-sub { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .card-sub b { color: var(--text); font-weight: 700; }
  .card-sub b.accent { color: var(--orange-text); }

  /* 이번 달 매출 카드: 로고 배경과 같은 차콜 + 화살표 무늬 */
  .card.main {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #2b3036 0%, var(--ink) 65%); border-color: var(--ink);
  }
  .card.main .wm { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); height: 150px; pointer-events: none; }
  .card.main > *:not(.wm) { position: relative; }
  .card.main .card-label { color: rgba(255,255,255,.7); }
  .tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--orange); padding: 1px 8px; border-radius: 4px; }
  .card.main .card-value { font-size: 42px; line-height: 1.15; margin-top: 8px; }
  .progress { height: 8px; background: rgba(255,255,255,.14); border-radius: 999px; overflow: hidden; margin-top: 16px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 999px; transition: width .8s ease; }
  .progress-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.7); }
  .progress-row b { color: #fff; font-weight: 800; }

  /* ================= 패널 ================= */
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row.top { grid-template-columns: 3fr 2fr; }
  .row.bottom { grid-template-columns: 1fr 1fr; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg-box { width: 10px; height: 10px; border-radius: 2px; background: var(--silver); }
  .lg-box.now { background: var(--orange); }
  .lg-line { width: 16px; border-top: 2px dashed var(--ink); }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .placeholder { color: var(--faint); font-size: 14px; padding: 40px 0; text-align: center; }

  /* ================= 깔때기 ================= */
  .funnel { display: grid; grid-template-columns: fit-content(120px) 1fr auto; column-gap: 12px; align-items: center; }
  .f-name { font-size: 13px; font-weight: 600; }
  .f-bar-wrap { display: flex; justify-content: center; }
  .f-bar { height: 34px; border-radius: 4px; background: var(--silver); }
  .f-bar.last { background: var(--orange); }
  .f-count { font-size: 14px; font-weight: 800; text-align: right; white-space: nowrap; }
  .f-conv { grid-column: 2; text-align: center; font-size: 12px; color: var(--sub); padding: 5px 0; }
  .f-conv b { color: var(--text); font-weight: 700; }
  .final {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 18px; padding: 14px 16px; border-radius: 8px; background: var(--ink); color: #fff;
  }
  .final-label { font-size: 13px; font-weight: 700; }
  .final-sub { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 2px; }
  .final-value { font-size: 28px; font-weight: 800; color: var(--orange); letter-spacing: -0.03em; white-space: nowrap; }

  /* ================= 순위 ================= */
  .rank { list-style: none; display: grid; gap: 14px; }
  .rank-top { display: flex; align-items: center; gap: 10px; }
  .rank-no {
    width: 22px; height: 22px; border-radius: 4px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--sub); background: var(--track);
  }
  .rank-no.first { background: var(--orange); color: #fff; }
  .rank-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-amt { font-size: 14px; font-weight: 800; white-space: nowrap; }
  .rank-track { height: 8px; border-radius: 999px; background: var(--track); margin: 8px 0 0 32px; overflow: hidden; }
  .rank-track span { display: block; height: 100%; border-radius: 999px; background: var(--silver); }
  .rank li:first-child .rank-track span { background: var(--steel-dark); }

  /* ================= 화면 크기별 ================= */
  @media (max-width: 960px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .card.main { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .row.top, .row.bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .topbar-inner { padding: 12px 14px; }
    .brand { gap: 10px; }
    .mark { width: 36px; height: 36px; }
    .brand-name { font-size: 21px; }
    .brand-tag { font-size: 9.5px; letter-spacing: 0.12em; }
    .btn { padding: 7px 13px; }
    .wrap { padding: 0 14px 40px; }
    .page-head { margin: 20px 0 14px; }
    h1 { font-size: 20px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .card.target { grid-column: 1 / -1; }
    .row { gap: 10px; margin-bottom: 10px; }
    .card, .panel { padding: 16px; }
    .card-value { font-size: 21px; }
    .card.main .card-value { font-size: 34px; }
    .card.main .wm { height: 120px; }
    .final-value { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress span { transition: none; }
  }
</style>
<script>
  // 스크립트가 아예 멈췄을 때(예: Supabase 도구를 못 불러옴) 이유를 화면에 보여주기
  window.addEventListener('error', function (e) {
    var n = document.getElementById('notice');
    if (!n) return;
    var noLib = typeof window.supabase === 'undefined';
    n.innerHTML = '<b>' + (noLib ? 'Supabase 도구를 불러오지 못했어요.' : '화면을 그리다 오류가 났어요.') + '</b>'
      + (noLib ? '<br>인터넷 연결을 확인하고 새로고침해 주세요.' : '') + '<div class="msg"></div>';
    n.querySelector('.msg').textContent = e.message || '';
    n.style.display = 'block';
    var u = document.getElementById('updated');
    if (u) u.textContent = '불러오기 실패';
  });
</script>

  const pct = (a, b) => (b ? trimZero((a / b * 100).toFixed(1)) + '%' : '-');

  // '2026-09', '9', '9월' 등을 '9월'로
  function monthLabel(m) {

      text = `${t}테이블에 필요한 칸(컬럼)이 없거나 이름이 달라요.`;
    } else if (code === 'PGRST205' || code === '42P01' || /could not find the table|does not exist/i.test(msg)) {
      text = `${t}테이블을 찾지 못했어요. Supabase에 이 이름 그대로(전부 소문자) 테이블이 있는지 확인해 주세요.`;
    } else if (code === '42501' || /permission denied/i.test(msg)) {
      text = `${t}테이블을 읽을 권한이 없어요. 읽기(SELECT) 권한과 RLS 정책을 확인해 주세요.`;
    } else if (/invalid api key|jwt|apikey/i.test(msg)) {
      text = 'Supabase 키가 맞지 않아요. 코드 위쪽 SUPABASE_KEY를 확인해 주세요.';
    } else if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      text = 'Supabase에 연결하지 못했어요. 인터넷 연결과 SUPABASE_URL 주소를 확인해 주세요.';
    } else {
      text = `${t}데이터를 읽는 중 문제가 생겼어요.`;
    }
    return `<div class="line">${text}<div class="msg">${esc((code ? code + ' · ' : '') + msg)}</div></div>`;
  }

  // ================= 데이터 불러오기 =================
  async function load() {
    const btn = $('refresh');
    btn.disabled = true;
    hideNotice();
    try {
      const results = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('*')
      ]);
      const [m, p, r] = results;

      // 테이블마다 따로 확인 (되는 테이블은 그대로 보여주기)
      const problems = [];
      results.forEach((res, i) => { if (res.error) problems.push(explain(TABLES[i], res.error)); });

      state.monthly = m.error ? [] : (m.data || []).map((d) => ({ month: d.month, revenue: num(d.revenue), target: num(d.target) }));
      state.pipeline = p.error ? [] : (p.data || []).map((d) => ({ stage: d.stage, count: num(d.count) }));
      state.rank = r.error ? [] : (r.data || []).map((d) => ({ kind: String(d.kind || '').trim().toLowerCase(), name: d.name, amount: num(d.amount) }));

      renderAll();

      if (problems.length) {
        $('updated').textContent = problems.length === 3 ? '불러오기 실패' : '일부 데이터를 불러오지 못했어요';
        showNotice('데이터를 불러오지 못했어요.', [...new Set(problems)].join(''));
      } else {
        $('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        if (!state.monthly.length && !state.pipeline.length && !state.rank.length) {
          showNotice('가져온 데이터가 없어요.', '<div class="line">테이블에 데이터가 있는데도 이렇게 보이면, 세 테이블에 읽기(SELECT) 허용 정책(RLS)이 있는지 확인해 주세요.</div>');
        }
      }
    } catch (e) {
      $('updated').textContent = '불러오기 실패';
      showNotice('데이터를 불러오지 못했어요.', explain('', e));
    } finally {
      btn.disabled = false;
    }
  }

  function showNotice(title, body) {
    const n = $('notice');
    n.innerHTML = `<b>${title}</b>${body}`;
    n.style.display = 'block';
  }
  function hideNotice() { $('notice').style.display = 'none'; }

  function renderAll() {
    renderCards();
    renderMonthly();
    renderFunnel();
    renderRank('rankPerson', 'person');
    renderRank('rankProduct', 'product');
  }

  // ================= 1. 카드 =================
  function renderCards() {
    const m = state.monthly, p = state.pipeline;
    const cur = m[m.length - 1];
    const last = p[p.length - 1];
    const contracts = last ? last.count : 0;

    $('contracts').textContent = last ? contracts.toLocaleString('ko-KR') + '건' : '–';
    $('contractsSub').textContent = last ? `마지막 단계 '${last.stage}' 기준` : '영업 단계 데이터 없음';

    if (!cur) {
      ['revenue', 'target', 'aov', 'rateText', 'curMonth'].forEach((id) => ($(id).textContent = '–'));
      $('remain').textContent = '월별 매출 데이터 없음';
      $('aovSub').innerHTML = '&nbsp;';
      $('rateBar').style.width = '0';
      return;
    }

    $('curMonth').textContent = monthLabel(cur.month);
    $('revenue').textContent = won(cur.revenue);
    $('revenue').title = fullWon(cur.revenue);
    $('rateText').textContent = pct(cur.revenue, cur.target);
    $('rateBar').style.width = (cur.target ? Math.min(cur.revenue / cur.target * 100, 100) : 0) + '%';

    $('target').textContent = won(cur.target);
    $('target').title = fullWon(cur.target);
    const remain = cur.target - cur.revenue;
    $('remain').innerHTML = remain > 0
      ? `남은 금액 <b>${won(remain)}</b>`
      : `<b class="accent">목표 달성</b>${remain < 0 ? ` · ${won(-remain)} 초과` : ''}`;

    $('aov').textContent = contracts ? won(cur.revenue / contracts) : '–';
    $('aovSub').textContent = `매출 ÷ 계약 ${contracts.toLocaleString('ko-KR')}건`;
  }

  // ================= 2. 월별 매출 막대그래프 =================
  function niceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
  }
  function barPath(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }

  let chartWidth = 0;
  function renderMonthly() {
    const box = $('monthly');
    const rows = state.monthly;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const W = Math.max(box.clientWidth, 260);
    chartWidth = box.clientWidth;
    const H = W < 480 ? 230 : 320;
    const pad = { top: 26, right: 4, bottom: 30, left: 50 };
    const iw = W - pad.left - pad.right;
    const ih = H - pad.top - pad.bottom;

    // 세로축: 가장 큰 값보다 살짝 높은 깔끔한 숫자로
    const maxVal = Math.max(...rows.map((r) => Math.max(r.revenue, r.target)), 1) * 1.08;
    let step = 0, ticks = 4;
    [4, 5, 3].forEach((t) => {
      const st = niceStep(maxVal / t);
      if (!step || st * t < step * ticks) { step = st; ticks = t; }
    });
    const yMax = step * ticks;
    const y = (v) => pad.top + ih - (v / yMax) * ih;

    const n = rows.length;
    const slot = iw / n;
    const bw = Math.min(slot * 0.58, 46);
    const lastIdx = n - 1;
    const showAllValues = slot >= 54;
    const labelEvery = Math.max(1, Math.ceil(30 / slot));
    const cxOf = (i) => pad.left + slot * i + slot / 2;

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 매출 막대그래프">`;

    // 가로 눈금선
    for (let i = 0; i <= ticks; i++) {
      const v = step * i, yy = y(v);
      s += `<line x1="${pad.left}" x2="${W - pad.right}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? '#d3d7dc' : '#eef0f2'}"/>`;
      s += `<text x="${pad.left - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9aa0a6">${money(v)}</text>`;
    }

    // 막대 + 월 이름
    rows.forEach((r, i) => {
      const cx = cxOf(i);
      const top = y(r.revenue);
      const isCur = i === lastIdx;
      const tip = `${esc(monthLabel(r.month))} 매출 ${fullWon(r.revenue)} / 목표 ${fullWon(r.target)} (${pct(r.revenue, r.target)})`;
      s += `<path d="${barPath(cx - bw / 2, top, bw, pad.top + ih - top, 3)}" fill="${isCur ? ORANGE : BAR}"><title>${tip}</title></path>`;
      if ((lastIdx - i) % labelEvery === 0) {
        s += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="12" font-weight="${isCur ? 800 : 400}" fill="${isCur ? INK : '#6b7178'}">${esc(monthLabel(r.month))}</text>`;
      }
    });

    // 목표 점선 (같은 목표가 이어지는 달은 한 줄로)
    let i = 0;
    while (i < n) {
      let j = i;
      while (j + 1 < n && rows[j + 1].target === rows[i].target) j++;
      const t = rows[i].target;
      if (t > 0) {
        const yy = y(t);
        s += `<line x1="${pad.left + slot * i}" x2="${pad.left + slot * (j + 1)}" y1="${yy}" y2="${yy}" stroke="${INK}" stroke-width="1.5" stroke-dasharray="5 4"><title>목표 ${fullWon(t)}</title></line>`;
      }
      i = j + 1;
    }

    // 막대 위 금액 (점선 위에 겹쳐도 읽히도록 흰 테두리)
    rows.forEach((r, i) => {
      const isCur = i === lastIdx;
      if (!showAllValues && !isCur) return;
      s += `<text x="${cxOf(i)}" y="${y(r.revenue) - 8}" text-anchor="middle" font-size="11" font-weight="${isCur ? 800 : 500}" fill="${isCur ? ORANGE_TEXT : '#6b7178'}" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${money(r.revenue)}</text>`;
    });

    s += '</svg>';
    box.innerHTML = s;
  }

  // ================= 3. 영업 단계 깔때기 =================
  function renderFunnel() {
    const box = $('funnel');
    const rows = state.pipeline;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const first = rows[0], last = rows[rows.length - 1];
    const max = Math.max(...rows.map((r) => r.count), 1);
    let h = '<div class="funnel">';
    rows.forEach((r, i) => {
      const gridRow = i * 2 + 1;
      if (i > 0) {
        h += `<div class="f-conv" style="grid-row:${gridRow - 1}">↓ 전환 <b>${pct(r.count, rows[i - 1].count)}</b></div>`;
      }
      const w = Math.max(r.count / max * 100, 4);
      h += `<div class="f-name" style="grid-row:${gridRow};grid-column:1">${esc(r.stage)}</div>`;
      h += `<div class="f-bar-wrap" style="grid-row:${gridRow};grid-column:2"><div class="f-bar${i === rows.length - 1 ? ' last' : ''}" style="width:${w}%"></div></div>`;
      h += `<div class="f-count" style="grid-row:${gridRow};grid-column:3">${r.count.toLocaleString('ko-KR')}건</div>`;
    });
    h += '</div>';
    h += `
      <div class="final">
        <div>
          <div class="final-label">최종 전환율</div>
          <div class="final-sub">${esc(last.stage)} ${last.count.toLocaleString('ko-KR')}건 ÷ ${esc(first.stage)} ${first.count.toLocaleString('ko-KR')}건</div>
        </div>
        <div class="final-value">${pct(last.count, first.count)}</div>
      </div>`;
    box.innerHTML = h;
  }

  // ================= 4, 5. 순위 =================
  function renderRank(id, kind) {
    const box = $(id);
    const rows = state.rank.filter((r) => r.kind === kind).sort((a, b) => b.amount - a.amount);
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const max = Math.max(rows[0].amount, 1);
    box.innerHTML = '<ol class="rank">' + rows.map((r, i) => `
      <li>
        <div class="rank-top">
          <span class="rank-no${i === 0 ? ' first' : ''}">${i + 1}</span>
          <span class="rank-name">${esc(r.name)}</span>
          <span class="rank-amt" title="${fullWon(r.amount)}">${won(r.amount)}</span>
        </div>
        <div class="rank-track"><span style="width:${Math.max(r.amount / max * 100, 2)}%"></span></div>
      </li>`).join('') + '</ol>';
  }

  // ================= 시작 =================
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.monthly.length && $('monthly').clientWidth !== chartWidth) renderMonthly();
    }, 150);
  });
  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
