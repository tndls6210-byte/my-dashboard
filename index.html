<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABOS 경영 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --ink: #1b1e22;
    --orange-brand: #ff4500;
    --text: #1b1e22;
    --sub: #6b7178;
    --faint: #9aa0a6;
    --line: #e5e7eb;
    --track: #eef0f2;
    /* 영역별 색 */
    --c-sales: #2563eb;      /* 매출 — 파랑 */
    --c-mkt: #f97316;        /* 광고비 — 주황 */
    --c-cus: #0d9488;        /* 고객 — 청록 */
    --c-profit: #16a34a;     /* 이익 — 초록 */
    --c-hr: #7c3aed;         /* 인력 — 보라 */
    /* 신호등·좋음/나쁨 */
    --good: #16a34a;
    --bad: #dc2626;
    --warn: #ca8a04;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #fff;
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum";
    line-height: 1.45;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 상단 브랜드 바 ================= */
  .topbar { background: var(--ink); border-bottom: 3px solid var(--orange-brand); color: #fff; }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 42px; height: 42px; display: block; flex-shrink: 0; border-radius: 2px; }
  .brand-name { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; line-height: 1; }
  .brand-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: #b9c1ca; margin-top: 6px; white-space: nowrap; }
  .btn {
    flex-shrink: 0; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff;
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover { border-color: var(--orange-brand); background: rgba(255,69,0,.14); }
  .btn:focus-visible { outline: 2px solid var(--orange-brand); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 56px; }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 12px; margin: 28px 0 18px;
  }
  .title-line { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .tag { font-size: 12px; font-weight: 700; color: #fff; background: var(--ink); padding: 2px 9px; border-radius: 4px; }
  .updated { font-size: 13px; color: var(--sub); }

  .notice {
    display: none; border: 1px solid var(--line); border-left: 3px solid var(--orange-brand);
    background: #fafafa; border-radius: 8px; padding: 14px 16px; font-size: 14px; margin-bottom: 14px;
  }
  .notice .line { margin-top: 8px; }
  .notice .msg { margin-top: 2px; font-size: 12px; color: var(--sub); word-break: break-all; }

  /* ================= 1. 영역 카드 5개 ================= */
  .areas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
  .area {
    border: 1px solid var(--line); border-top: 5px solid var(--c); border-radius: 10px;
    padding: 16px 16px 14px; min-width: 0; background: #fff; display: flex; flex-direction: column;
  }
  .area-name { font-size: 14px; font-weight: 800; color: var(--c); }
  .area-value {
    font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-top: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .area-sub { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .signal {
    display: flex; align-items: center; gap: 7px; margin-top: auto; padding-top: 12px;
    border-top: 1px solid #f0f1f3; font-size: 13px; font-weight: 700;
  }
  .area-sub + .signal { margin-top: 14px; }
  .signal i { width: 11px; height: 11px; border-radius: 50%; background: #c9ced4; box-shadow: 0 0 0 3px rgba(0,0,0,.04); }
  .signal.green i { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .signal.yellow i { background: #eab308; box-shadow: 0 0 0 3px rgba(234,179,8,.2); }
  .signal.red i { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18); }
  .signal.green { color: var(--good); }
  .signal.yellow { color: var(--warn); }
  .signal.red { color: var(--bad); }
  .signal.none { color: var(--faint); font-weight: 500; }
  /* 카드 = 상세 대시보드로 가는 링크 */
  a.area { text-decoration: none; color: inherit; cursor: pointer; transition: border-color .15s, background-color .15s; }
  a.area:hover { border-color: var(--c); background: #fcfcfd; }
  a.area:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .signal .more { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--faint); }
  a.area:hover .more { color: var(--c); }

  /* ================= 패널 ================= */
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row.mid { grid-template-columns: 1fr 1fr; }
  .panel { border: 1px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; background: #fff; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .hint { font-size: 12px; color: var(--sub); }
  .placeholder { color: var(--faint); font-size: 14px; padding: 36px 0; text-align: center; }

  /* ================= 2. 목표 달성률 막대 ================= */
  .ach { display: grid; gap: 14px; }
  .ach-row { display: grid; grid-template-columns: 110px 1fr 56px; gap: 12px; align-items: center; }
  .ach-name { font-size: 14px; font-weight: 800; color: var(--c); line-height: 1.25; }
  .ach-name small { display: block; font-size: 11px; font-weight: 500; color: var(--faint); margin-top: 2px; }
  .ach-track { position: relative; height: 18px; background: var(--track); border-radius: 4px; }
  .ach-track span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 4px; }
  .ach-track i { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; background: var(--ink); }
  .ach-val { text-align: right; font-size: 15px; font-weight: 800; }
  .ach-axis { display: grid; grid-template-columns: 110px 1fr 56px; gap: 12px; font-size: 11px; color: var(--faint); }
  .ach-axis div { position: relative; height: 14px; }
  .ach-axis b { position: absolute; transform: translateX(-50%); font-weight: 500; white-space: nowrap; }
  .ach-axis b.first { transform: none; }
  .ach-axis b.hundred { color: var(--ink); font-weight: 700; }
  .src { font-size: 11px; color: var(--faint); margin-top: 14px; }

  /* ================= 3. 이번 달 변화 ================= */
  .chg { list-style: none; display: grid; gap: 4px; }
  .chg li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #f0f1f3; }
  .chg li:last-child { border-bottom: none; }
  .chg .no { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: #f3f4f6; color: var(--sub); }
  .chg .nm { font-size: 15px; font-weight: 800; }
  .chg .ds { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; }
  .chg .val { font-size: 18px; font-weight: 800; white-space: nowrap; text-align: right; }
  .chg .val small { display: block; font-size: 11px; font-weight: 700; text-align: right; }
  .chg .good { color: var(--good); }
  .chg .bad { color: var(--bad); }
  .chg .flat { color: var(--faint); }

  /* ================= 4. 6개월 추이 ================= */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 18px; height: 3px; border-radius: 2px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* ================= 화면 크기별 ================= */
  @media (max-width: 1000px) {
    .areas { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 860px) {
    .row.mid { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .topbar-inner { padding: 12px 14px; }
    .brand { gap: 10px; }
    .mark { width: 36px; height: 36px; }
    .brand-name { font-size: 21px; }
    .brand-tag { font-size: 9.5px; letter-spacing: 0.12em; }
    .btn { padding: 7px 13px; }
    .wrap { padding: 0 14px 40px; }
    .page-head { margin: 20px 0 14px; }
    h1 { font-size: 20px; }
    .areas { grid-template-columns: 1fr 1fr; gap: 10px; }
    .areas .area:first-child { grid-column: 1 / -1; }
    .area-value { font-size: 22px; }
    .row { gap: 10px; margin-bottom: 10px; }
    .panel { padding: 16px; }
    .ach-row, .ach-axis { grid-template-columns: 86px 1fr 48px; gap: 8px; }
  }
</style>
<script>
  // 스크립트가 아예 멈췄을 때(예: Supabase 도구를 못 불러옴) 이유를 화면에 보여주기
  window.addEventListener('error', function (e) {
    var n = document.getElementById('notice');
    if (!n) return;
    var noLib = typeof window.supabase === 'undefined';
    n.innerHTML = '<b>' + (noLib ? 'Supabase 도구를 불러오지 못했어요.' : '화면을 그리다 오류가 났어요.') + '</b>'
      + (noLib ? '<br>인터넷 연결을 확인하고 새로고침해 주세요.' : '') + '<div class="msg"></div>';
    n.querySelector('.msg').textContent = e.message || '';
    n.style.display = 'block';
    var u = document.getElementById('updated');
    if (u) u.textContent = '불러오기 실패';
  });
</script>
</head>

    return Math.round(w).toLocaleString('ko-KR');
  }
  const won = (v) => (num(v) < 0 ? '-' : '') + money(Math.abs(num(v))) + '원';

  function monthLabel(m) {
    const s = String(m ?? '').trim();
    const ym = s.match(/^(\d{4})[-./](\d{1,2})/);
    if (ym) return Number(ym[2]) + '월';
    if (/^\d{1,2}$/.test(s)) return Number(s) + '월';
    return s;
  }
  // sort_order 순서로 받은 목록에서 이번 달(마지막)과 전월(그 앞)
  const last2 = (rows) => ({ cur: rows[rows.length - 1] || null, prev: rows[rows.length - 2] || null });

  // ================= 오류를 알아보기 쉬운 말로 =================
  function explain(t, err) {
    const msg = String((err && (err.message || err)) || '');
    const code = (err && err.code) || '';
    let text;
    if (code === 'PGRST205' || code === '42P01' || /could not find the table/i.test(msg)) {
      text = `<b>${t.name}</b> 테이블이 아직 없어요 → <b>${t.from}</b> SQL을 Supabase에서 먼저 실행해 주세요.`;
    } else if (code === '42703' || /column .*does not exist/i.test(msg)) {
      text = `<b>${t.name}</b> 테이블에 필요한 칸(컬럼)이 없거나 이름이 달라요.`;
    } else if (code === '42501' || /permission denied/i.test(msg)) {
      text = `<b>${t.name}</b> 테이블을 읽을 권한이 없어요. 읽기(SELECT) 권한과 RLS 정책을 확인해 주세요.`;
    } else if (/invalid api key|jwt|apikey/i.test(msg)) {
      text = 'Supabase 키가 맞지 않아요. 코드 위쪽 SUPABASE_KEY를 확인해 주세요.';
    } else if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      text = 'Supabase에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
    } else {
      text = `<b>${t.name}</b> 데이터를 읽는 중 문제가 생겼어요.`;
    }
    return `<div class="line">${text}<div class="msg">${esc((code ? code + ' · ' : '') + msg)}</div></div>`;
  }

  // ================= 데이터 불러오기 =================
  async function load() {
    const btn = $('refresh');
    btn.disabled = true;
    $('notice').style.display = 'none';
    try {
      const results = await Promise.all(
        TABLES.map((t) => db.from(t.name).select('*').order('sort_order', { ascending: true }))
      );
      // 데이터 테이블 5개만 오류로 표시 (exec_target은 없으면 기본 목표값 사용)
      const problems = [];
      results.forEach((res, i) => { if (res.error && TABLES[i].name !== 'exec_target') problems.push(explain(TABLES[i], res.error)); });
      const rows = (i) => (results[i].error ? [] : results[i].data || []);

      state.sales = rows(0).map((d) => ({ month: d.month, revenue: num(d.revenue), target: num(d.target) }));
      state.mkt = rows(1).map((d) => ({ month: d.month, spend: num(d.spend), roas: num(d.roas) }));
      state.cus = rows(2).map((d) => ({ month: d.month, total: num(d.total_customers), churn: num(d.churn_rate) }));
      state.pl = rows(3).map((d) => {
        const cost = num(d.cogs) + num(d.sga) + num(d.other_cost);
        const revenue = num(d.revenue);
        return { month: d.month, revenue, op: revenue - cost, margin: revenue ? (revenue - cost) / revenue * 100 : null };
      });
      state.hr = rows(4).map((d) => ({
        month: d.month, headcount: num(d.headcount), payroll: num(d.payroll), revenue: num(d.revenue)
      }));
      // 목표: 기본값으로 시작하고, exec_target 테이블이 있으면 영역마다 sort_order가 가장 큰 줄로 덮어쓰기
      state.target = JSON.parse(JSON.stringify(DEFAULT_TARGETS));
      const targetRows = rows(5);
      targetRows.forEach((d) => {
        const k = String(d.area ?? '').trim();
        state.target[k] = { target: num(d.target), green: d.green == null ? 100 : num(d.green), yellow: d.yellow == null ? 90 : num(d.yellow) };
      });
      $('targetSrc').textContent = results[5].error
        ? '목표값: 코드 안의 기본값 사용 중 (Supabase에 exec_target 테이블이 아직 없어요)'
        : targetRows.length ? '목표값: Supabase exec_target 테이블' : '목표값: 코드 안의 기본값 사용 중 (exec_target 테이블이 비어 있어요)';

      renderAll();

      const cur = last2(state.sales).cur || last2(state.pl).cur;
      $('curMonth').textContent = cur ? monthLabel(cur.month) : '–';
      if (problems.length) {
        $('updated').textContent = problems.length >= 5 ? '불러오기 실패' : '일부 데이터를 불러오지 못했어요';
        $('notice').innerHTML = '<b>일부 데이터를 불러오지 못했어요.</b>' + [...new Set(problems)].join('');
        $('notice').style.display = 'block';
      } else {
        $('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {
      $('updated').textContent = '불러오기 실패';
      $('notice').innerHTML = '<b>데이터를 불러오지 못했어요.</b>' + explain({ name: '', from: '' }, e);
      $('notice').style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  // ================= 영역별 계산 =================
  function computeAreas() {
    const S = last2(state.sales), M = last2(state.mkt), C = last2(state.cus), P = last2(state.pl), H = last2(state.hr);
    const T = state.target;
    const ach = (actual, key, fallback) => {
      const tgt = (T[key] && T[key].target) || fallback || 0;
      return tgt ? actual / tgt * 100 : null;
    };
    const ratio = H.cur && H.cur.revenue ? H.cur.payroll / H.cur.revenue * 100 : null;
    const rpp = H.cur && H.cur.headcount ? H.cur.revenue / H.cur.headcount : null;

    return {
      매출: S.cur ? { value: won(S.cur.revenue), sub: `목표 ${won((T.매출 && T.매출.target) || S.cur.target)}`, ach: ach(S.cur.revenue, '매출', S.cur.target) } : null,
      광고비: M.cur ? { value: won(M.cur.spend), sub: `ROAS ${fmtPct(M.cur.roas, 0)}`, ach: ach(M.cur.roas, '광고비') } : null,
      고객: C.cur ? { value: count(C.cur.total) + '명', sub: `이탈률 ${fmtPct(C.cur.churn, 1)}`, ach: ach(C.cur.total, '고객') } : null,
      이익: P.cur ? { value: won(P.cur.op), sub: `영업이익률 ${fmtPct(P.cur.margin, 1)}`, ach: ach(P.cur.op, '이익') } : null,
      인력: H.cur ? { value: count(H.cur.headcount) + '명', sub: `인건비 비중 ${fmtPct(ratio, 1)}`, ach: rpp == null ? null : ach(rpp, '인력') } : null
    };
  }

  // 신호등: green 이상 정상, yellow 이상 주의, 그 미만 경고
  function signal(achv, key) {
    const t = state.target[key] || DEFAULT_TARGETS[key] || { green: 100, yellow: 90 };
    if (achv == null) return { cls: 'none', text: '데이터 없음' };
    if (achv >= t.green) return { cls: 'green', text: '정상' };
    if (achv >= t.yellow) return { cls: 'yellow', text: '주의' };
    return { cls: 'red', text: '경고' };
  }

  function renderAll() {
    const areas = computeAreas();
    renderCards(areas);
    renderAch(areas);
    renderChanges();
    renderTrend();
  }

  // ================= 1. 영역 카드 =================
  function renderCards(areas) {
    $('areas').innerHTML = AREA_KEYS.map((k) => {
      const a = areas[k];
      const sg = signal(a ? a.ach : null, k);
      return `<a class="area" href="${LINKS[k]}" style="--c:${COLORS[k]}" aria-label="${k} 대시보드 열기">
        <div class="area-name">${k}</div>
        <div class="area-value">${a ? a.value : '–'}</div>
        <div class="area-sub">${a ? a.sub : '데이터 없음'}</div>
        <div class="signal ${sg.cls}"><i></i>${sg.text}<span class="more">자세히 보기</span></div>
      </a>`;
    }).join('');
  }

  // ================= 2. 목표 달성률 막대 =================
  function renderAch(areas) {
    const box = $('ach');
    const list = AREA_KEYS.map((k) => ({ k, v: areas[k] ? areas[k].ach : null }));
    if (list.every((x) => x.v == null)) { box.innerHTML = placeholder('목표(exec_target) 데이터가 없어요'); return; }

    const scale = Math.max(150, ...list.map((x) => (x.v || 0) * 1.05));
    const pos = (v) => Math.min(Math.max(v, 0) / scale * 100, 100);
    let h = '<div class="ach">';
    list.forEach(({ k, v }) => {
      h += `<div class="ach-row" style="--c:${COLORS[k]}">
        <span class="ach-name">${k}<small>${ACH_DESC[k]}</small></span>
        <div class="ach-track"><span style="width:${v == null ? 0 : pos(v)}%"></span><i style="left:${pos(100)}%"></i></div>
        <span class="ach-val">${fmtPct(v, 0)}</span>
      </div>`;
    });
    h += `<div class="ach-axis"><span></span><div>
      <b class="first" style="left:0">0%</b>
      <b style="left:${pos(50)}%">50%</b>
      <b class="hundred" style="left:${pos(100)}%">100%</b>
      ${scale >= 150 ? `<b style="left:${pos(150)}%;transform:translateX(-100%)">150%</b>` : ''}
    </div><span></span></div>`;
    h += '</div>';
    box.innerHTML = h;
  }

  // ================= 3. 이번 달 변화 TOP 3 =================
  function renderChanges() {
    const box = $('changes');
    const S = last2(state.sales), M = last2(state.mkt), C = last2(state.cus), P = last2(state.pl), H = last2(state.hr);
    const hrRatio = (r) => (r && r.revenue ? r.payroll / r.revenue * 100 : null);

    // higherGood: 올라가는 게 좋은 지표인지
    const defs = [
      { name: '매출', cur: S.cur && S.cur.revenue, prev: S.prev && S.prev.revenue, higherGood: true, up: '지난달보다 매출이 늘었어요', down: '지난달보다 매출이 줄었어요' },
      { name: 'ROAS', cur: M.cur && M.cur.roas, prev: M.prev && M.prev.roas, higherGood: true, up: '광고비 대비 매출 효율이 좋아졌어요', down: '광고비 대비 매출 효율이 떨어졌어요' },
      { name: '이탈률', cur: C.cur && C.cur.churn, prev: C.prev && C.prev.churn, higherGood: false, up: '떠나는 고객이 늘었어요', down: '떠나는 고객이 줄었어요' },
      { name: '영업이익률', cur: P.cur && P.cur.margin, prev: P.prev && P.prev.margin, higherGood: true, up: '매출에서 남는 몫이 커졌어요', down: '매출에서 남는 몫이 줄었어요' },
      { name: '인건비 비중', cur: hrRatio(H.cur), prev: hrRatio(H.prev), higherGood: false, up: '매출 대비 인건비 부담이 커졌어요', down: '매출 대비 인건비 부담이 줄었어요' }
    ];

    const items = defs
      .filter((d) => d.cur != null && d.prev != null && d.prev !== 0)
      .map((d) => {
        const rate = (d.cur - d.prev) / Math.abs(d.prev) * 100;   // 전월 대비 변화율(%)
        const flat = Math.abs(rate) < 0.05;
        const good = d.higherGood ? rate > 0 : rate < 0;
        return { ...d, rate, flat, good };
      })
      .sort((a, b) => Math.abs(b.rate) - Math.abs(a.rate))
      .slice(0, 3);

    if (!items.length) { box.innerHTML = placeholder('비교할 전월 데이터가 없어요'); return; }

    box.innerHTML = '<ol class="chg">' + items.map((d, i) => {
      const cls = d.flat ? 'flat' : d.good ? 'good' : 'bad';
      const arrow = d.flat ? '–' : d.rate > 0 ? '▲' : '▼';
      return `<li>
        <span class="no">${i + 1}</span>
        <div><span class="nm">${d.name}</span><span class="ds">${d.flat ? '지난달과 거의 같아요' : d.rate > 0 ? d.up : d.down}</span></div>
        <span class="val ${cls}">${arrow} ${trimZero(Math.abs(d.rate).toFixed(1))}%<small>${d.flat ? '변화 없음' : d.good ? '좋아짐' : '나빠짐'}</small></span>
      </li>`;
    }).join('') + '</ol>';
  }

  // ================= 4. 6개월 종합 추이 =================
  function niceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => n <= s) * p;
  }

  let trendWidth = 0;
  function renderTrend() {
    const box = $('trend');
    // 기준 달: 영업(매출) 표의 최근 6개월, 없으면 손익 표
    const base = (state.sales.length ? state.sales : state.pl).slice(-6);
    if (!base.length) { box.innerHTML = placeholder(); return; }
    const months = base.map((r) => String(r.month).trim());
    const pick = (rows, f) => months.map((m) => { const r = rows.find((x) => String(x.month).trim() === m); return r ? f(r) : null; });
    const series = [
      { name: '매출', color: COLORS.매출, vals: pick(state.sales, (r) => r.revenue) },
      { name: '영업이익', color: COLORS.이익, vals: pick(state.pl, (r) => r.op) },
      { name: '광고비', color: COLORS.광고비, vals: pick(state.mkt, (r) => r.spend) }
    ];

    const W = Math.max(box.clientWidth, 260);
    trendWidth = box.clientWidth;
    const H = W < 480 ? 220 : 260;
    const pad = { top: 16, right: 12, bottom: 30, left: 52 };
    const iw = W - pad.left - pad.right;
    const ih = H - pad.top - pad.bottom;

    const all = series.flatMap((s) => s.vals).filter((v) => v != null);
    const hi = Math.max(1, ...all), lo = Math.min(0, ...all);
    const TICKS = 4;
    const step = niceStep((hi - lo) * 1.08 / TICKS);
    const yMax = Math.ceil(hi * 1.04 / step) * step;
    const yMin = lo < 0 ? Math.floor(lo / step) * step : 0;
    const y = (v) => pad.top + ((yMax - v) / (yMax - yMin)) * ih;
    const n = months.length;
    const x = (i) => pad.left + (n === 1 ? iw / 2 : (iw * i) / (n - 1));

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 매출·영업이익·광고비 추이">`;
    for (let v = yMin; v <= yMax + step / 2; v += step) {
      const yy = y(v);
      s += `<line x1="${pad.left}" x2="${W - pad.right}" y1="${yy}" y2="${yy}" stroke="${Math.abs(v) < step / 2 ? '#d3d7dc' : '#f0f1f3'}"/>`;
      s += `<text x="${pad.left - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9aa0a6">${money(v)}</text>`;
    }
    months.forEach((m, i) => {
      s += `<text x="${x(i)}" y="${H - 9}" text-anchor="middle" font-size="12" font-weight="${i === n - 1 ? 800 : 400}" fill="${i === n - 1 ? '#1b1e22' : '#6b7178'}">${esc(monthLabel(m))}</text>`;
    });
    series.forEach((sr) => {
      let d = '', pen = false;
      sr.vals.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + x(i) + ',' + y(v);
        pen = true;
      });
      if (d) s += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
      sr.vals.forEach((v, i) => {
        if (v == null) return;
        const lastPt = i === n - 1;
        s += `<circle cx="${x(i)}" cy="${y(v)}" r="${lastPt ? 4.5 : 3}" fill="${lastPt ? sr.color : '#fff'}" stroke="${sr.color}" stroke-width="2"><title>${esc(monthLabel(months[i]))} ${sr.name} ${won(v)}</title></circle>`;
      });
    });
    s += '</svg>';
    box.innerHTML = s;
  }

  // ================= 시작 =================
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if ($('trend').clientWidth !== trendWidth) renderTrend(); }, 150);
  });
  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
