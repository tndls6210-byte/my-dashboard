<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABOS 고객 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* ================= ABOS 로고에서 뽑은 색 ================= */
  :root {
    --ink: #1b1e22;          /* 로고 배경 차콜 */
    --steel-dark: #4b5259;   /* 진한 철제 회색 */
    --silver: #c9ced4;       /* 로고 은색 판 */
    --orange: #ff4500;       /* 로고 화살표 오렌지 */
    --orange-text: #d63a00;  /* 흰 바탕 위 오렌지 글씨 */
    --page: #f3f4f6;
    --text: #1b1e22;
    --sub: #6b7178;
    --faint: #9aa0a6;
    --line: #e3e6ea;
    --track: #eceef1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-feature-settings: "tnum";
    line-height: 1.45;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }

  /* ================= 상단 브랜드 바 ================= */
  .topbar { background: var(--ink); border-bottom: 3px solid var(--orange); color: #fff; }
  .topbar-inner {
    max-width: 1200px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 42px; height: 42px; display: block; flex-shrink: 0; border-radius: 2px; }
  .brand-name { font-size: 24px; font-weight: 900; letter-spacing: 0.02em; line-height: 1; }
  .brand-tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.18em; color: #b9c1ca; margin-top: 6px; white-space: nowrap; }
  .btn {
    flex-shrink: 0; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff;
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .btn:hover { border-color: var(--orange); background: rgba(255,69,0,.14); }
  .btn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 56px; }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
    gap: 4px 12px; margin: 28px 0 18px;
  }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .updated { font-size: 13px; color: var(--sub); }

  .notice {
    display: none; border: 1px solid var(--line); border-left: 3px solid var(--orange);
    background: #fff; border-radius: 8px; padding: 14px 16px; font-size: 14px; margin-bottom: 14px;
  }
  .notice .line { margin-top: 8px; }
  .notice .msg { margin-top: 2px; font-size: 12px; color: var(--sub); word-break: break-all; }

  /* ================= 카드 4개 ================= */
  .cards { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card, .panel { border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; background: #fff; }
  .card-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--sub); }
  .card-value {
    font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-top: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-sub { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .card-sub b { color: var(--text); font-weight: 700; }
  .card-sub b.accent { color: var(--orange-text); }
  .spark { margin-top: 12px; height: 36px; }
  .spark svg { display: block; overflow: visible; }
  .spark-cap { font-size: 11px; color: var(--faint); margin-top: 4px; }
  .mini-track { height: 6px; background: var(--track); border-radius: 999px; overflow: hidden; margin-top: 14px; }
  .mini-track span { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 999px; transition: width .8s ease; }

  /* 전체 고객 수 카드: 차콜 + 화살표 무늬 */
  .card.main {
    position: relative; overflow: hidden; color: #fff;
    background: linear-gradient(135deg, #2b3036 0%, var(--ink) 65%); border-color: var(--ink);
  }
  .card.main .wm { position: absolute; right: -14px; top: 50%; transform: translateY(-50%); height: 150px; pointer-events: none; }
  .card.main > *:not(.wm) { position: relative; }
  .card.main .card-label { color: rgba(255,255,255,.7); }
  .tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--orange); padding: 1px 8px; border-radius: 4px; }
  .card.main .card-value { font-size: 42px; line-height: 1.15; margin-top: 8px; }
  .main-stats { display: flex; gap: 22px; margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.12); }
  .main-stats span { display: block; font-size: 12px; color: rgba(255,255,255,.6); }
  .main-stats b { font-size: 16px; font-weight: 800; }
  .main-stats b.up { color: var(--orange); }

  /* ================= 패널 ================= */
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row.top { grid-template-columns: 3fr 2fr; }
  .row.bottom { grid-template-columns: 1fr 1fr; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 18px; }
  .panel h2 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
  .hint { font-size: 12px; color: var(--sub); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--sub); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-linedot { position: relative; width: 18px; height: 2px; background: var(--ink); }
  .lg-linedot::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; box-sizing: border-box;
    border: 2px solid var(--ink); background: #fff; border-radius: 50%; transform: translate(-50%, -50%);
  }
  .lg-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
  .lg-dash { width: 16px; border-top: 2px dashed var(--steel-dark); }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .placeholder { color: var(--faint); font-size: 14px; padding: 40px 0; text-align: center; }

  /* ================= 코호트 표 ================= */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
  table.cohort { width: 100%; min-width: 520px; border-collapse: separate; border-spacing: 4px; font-size: 13px; margin: -4px; }
  .cohort th { font-size: 12px; font-weight: 600; color: var(--sub); padding: 0 4px 6px; text-align: center; white-space: nowrap; }
  .cohort th:first-child, .cohort td.m { text-align: left; position: sticky; left: 0; z-index: 1; background: #fff; }
  .cohort td.m { font-weight: 700; padding-right: 10px; white-space: nowrap; }
  .cohort td.c { height: 40px; text-align: center; border-radius: 4px; font-weight: 700; white-space: nowrap; }
  .cohort td.empty { background: #f4f5f6; }
  .scale { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--sub); }
  .scale i { display: block; width: 90px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, rgba(27,30,34,.06), rgba(27,30,34,.9)); }

  /* ================= 도넛 ================= */
  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .donut { width: 180px; height: 180px; flex-shrink: 0; margin: 0 auto; }
  .donut svg { display: block; }
  .mix { flex: 1; min-width: 200px; }
  .mix-item { display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f1f3; }
  .mix-item i { width: 10px; height: 10px; border-radius: 2px; }
  .mix-item .nm { font-size: 14px; font-weight: 600; }
  .mix-item .pc { font-size: 15px; font-weight: 800; text-align: right; }
  .mix-item .amt { grid-column: 2 / 4; font-size: 12px; color: var(--sub); }
  .ltv-box { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 14px; background: var(--ink); color: #fff; border-radius: 8px; }
  .ltv-box span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
  .ltv-box b { font-size: 20px; font-weight: 800; color: var(--orange); white-space: nowrap; }

  /* ================= 재구매율 가로 막대 ================= */
  .rp { display: grid; gap: 20px; }
  .rp-row { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 12px; }
  .rp-label { font-size: 14px; font-weight: 600; }
  .rp-track { position: relative; height: 26px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .rp-track span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--silver); border-radius: 4px; }
  .rp-row.hl .rp-track span { background: var(--orange); }
  .rp-val { font-size: 15px; font-weight: 800; text-align: right; }
  .rp-row.hl .rp-val { color: var(--orange-text); }
  .rp-axis { display: grid; grid-template-columns: 56px 1fr 56px; gap: 12px; font-size: 11px; color: var(--faint); }
  .rp-axis div { display: flex; justify-content: space-between; }

  /* ================= 화면 크기별 ================= */
  @media (max-width: 960px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .card.main { grid-column: 1 / -1; }
  }
  @media (max-width: 860px) {
    .row.top, .row.bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .topbar-inner { padding: 12px 14px; }
    .brand { gap: 10px; }
    .mark { width: 36px; height: 36px; }
    .brand-name { font-size: 21px; }
    .brand-tag { font-size: 9.5px; letter-spacing: 0.12em; }
    .btn { padding: 7px 13px; }
    .wrap { padding: 0 14px 40px; }
    .page-head { margin: 20px 0 14px; }
    h1 { font-size: 20px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .card.wide { grid-column: 1 / -1; }
    .row { gap: 10px; margin-bottom: 10px; }
    .card, .panel { padding: 16px; }
    .table-wrap { margin: 0 -16px; padding: 0 16px; }
    .card-value { font-size: 21px; }
    .card.main .card-value { font-size: 34px; }
    .card.main .wm { height: 120px; }
    .donut-wrap { gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mini-track span { transition: none; }
  }

  /* 경영 대시보드로 돌아가기 */
  a.brand { text-decoration: none; color: inherit; }
  .back {
    display: inline-flex; align-items: center; gap: 4px; margin-bottom: 6px;
    font-size: 13px; font-weight: 600; color: var(--sub); text-decoration: none;
  }
  .back:hover { color: var(--orange-text); }
  .back:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 2px; }
</style>
<script>
  // 스크립트가 아예 멈췄을 때(예: Supabase 도구를 못 불러옴) 이유를 화면에 보여주기
  window.addEventListener('error', function (e) {
    var n = document.getElementById('notice');
    if (!n) return;
    var noLib = typeof window.supabase === 'undefined';
    n.innerHTML = '<b>' + (noLib ? 'Supabase 도구를 불러오지 못했어요.' : '화면을 그리다 오류가 났어요.') + '</b>'
      + (noLib ? '<br>인터넷 연결을 확인하고 새로고침해 주세요.' : '') + '<div class="msg"></div>';
    n.querySelector('.msg').textContent = e.message || '';
    n.style.display = 'block';
    var u = document.getElementById('updated');
    if (u) u.textContent = '불러오기 실패';
  });
</script>
</head>

  const won = (v) => money(v) + '원';
  const fullWon = (v) => Math.round(num(v) * MONEY_UNIT).toLocaleString('ko-KR') + '원';
  const moneyDetail = (v) => (Math.abs(num(v) * MONEY_UNIT) < 1e6 ? fullWon(v) : won(v));

  function monthLabel(m) {
    const s = String(m ?? '').trim();
    const ym = s.match(/^(\d{4})[-./](\d{1,2})/);
    if (ym) return Number(ym[2]) + '월';
    if (/^\d{1,2}$/.test(s)) return Number(s) + '월';
    return s;
  }
  // '6개월', '6', 'M+6' → 6
  const periodMonths = (p) => { const m = String(p ?? '').match(/\d+/); return m ? Number(m[0]) : null; };
  const periodLabel = (p) => (/^\d+$/.test(String(p ?? '').trim()) ? String(p).trim() + '개월' : String(p ?? ''));

  // ================= 오류를 알아보기 쉬운 말로 =================
  const TABLES = ['customer_summary', 'customer_cohort', 'customer_repeat', 'customer_mix'];
  function explain(table, err) {
    const msg = String((err && (err.message || err)) || '');
    const code = (err && err.code) || '';
    const t = table ? `<b>${table}</b> ` : '';
    let text;
    if (code === '42703' || /column .*does not exist/i.test(msg)) {
      text = `${t}테이블에 필요한 칸(컬럼)이 없거나 이름이 달라요.`;
    } else if (code === 'PGRST205' || code === '42P01' || /could not find the table|does not exist/i.test(msg)) {
      text = `${t}테이블을 찾지 못했어요. Supabase에서 테이블을 만드는 SQL을 실행했는지 확인해 주세요.`;
    } else if (code === '42501' || /permission denied/i.test(msg)) {
      text = `${t}테이블을 읽을 권한이 없어요. 읽기(SELECT) 권한과 RLS 정책을 확인해 주세요.`;
    } else if (/invalid api key|jwt|apikey/i.test(msg)) {
      text = 'Supabase 키가 맞지 않아요. 코드 위쪽 SUPABASE_KEY를 확인해 주세요.';
    } else if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      text = 'Supabase에 연결하지 못했어요. 인터넷 연결과 SUPABASE_URL 주소를 확인해 주세요.';
    } else {
      text = `${t}데이터를 읽는 중 문제가 생겼어요.`;
    }
    return `<div class="line">${text}<div class="msg">${esc((code ? code + ' · ' : '') + msg)}</div></div>`;
  }

  // ================= 데이터 불러오기 =================
  async function load() {
    const btn = $('refresh');
    btn.disabled = true;
    hideNotice();
    try {
      const results = await Promise.all([
        db.from('customer_summary').select('*').order('sort_order', { ascending: true }),
        db.from('customer_cohort').select('*').order('sort_order', { ascending: true }),
        db.from('customer_repeat').select('*').order('sort_order', { ascending: true }),
        db.from('customer_mix').select('*').order('sort_order', { ascending: true })
      ]);
      const [s, c, r, x] = results;

      const problems = [];
      results.forEach((res, i) => { if (res.error) problems.push(explain(TABLES[i], res.error)); });

      state.summary = s.error ? [] : (s.data || []).map((d) => ({
        month: d.month, total: num(d.total_customers), fresh: num(d.new_customers), churn: num(d.churn_rate), ltv: num(d.ltv)
      }));
      state.cohort = c.error ? [] : (c.data || []).map((d) => ({ cohort: d.cohort_month, after: num(d.months_after), retention: d.retention == null ? null : num(d.retention) }));
      state.repeat = r.error ? [] : (r.data || []).map((d) => ({ period: d.period, rate: num(d.rate) }));
      state.mix = x.error ? [] : (x.data || []).map((d) => ({ segment: d.segment, revenue: num(d.revenue) }));

      renderAll();

      if (problems.length) {
        $('updated').textContent = problems.length === TABLES.length ? '불러오기 실패' : '일부 데이터를 불러오지 못했어요';
        showNotice('데이터를 불러오지 못했어요.', [...new Set(problems)].join(''));
      } else {
        $('updated').textContent = '마지막 업데이트 ' + new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        if (!state.summary.length && !state.cohort.length && !state.repeat.length && !state.mix.length) {
          showNotice('가져온 데이터가 없어요.', '<div class="line">테이블에 데이터가 있는데도 이렇게 보이면, 테이블에 읽기(SELECT) 허용 정책(RLS)이 있는지 확인해 주세요.</div>');
        }
      }
    } catch (e) {
      $('updated').textContent = '불러오기 실패';
      showNotice('데이터를 불러오지 못했어요.', explain('', e));
    } finally {
      btn.disabled = false;
    }
  }

  function showNotice(title, body) {
    const n = $('notice');
    n.innerHTML = `<b>${title}</b>${body}`;
    n.style.display = 'block';
  }
  function hideNotice() { $('notice').style.display = 'none'; }

  function renderAll() {
    renderCards();
    renderCohort();
    renderMix();
    renderRepeat();
    renderChurn();
  }

  // 전월 대비 문구: good=true면 좋아진 쪽을 주황으로
  function deltaText(d, unit, good) {
    if (d == null || !isFinite(d)) return '';
    if (Math.abs(d) < 1e-9) return '전월과 같음';
    const arrow = d > 0 ? '▲' : '▼';
    return `전월 대비 <b class="${good ? 'accent' : ''}">${arrow} ${unit(Math.abs(d))}</b> ${good ? '개선' : '악화'}`;
  }

  // ================= 1. 카드 =================
  function renderCards() {
    const s = state.summary;
    const cur = s[s.length - 1];
    const prev = s.length >= 2 ? s[s.length - 2] : null;

    if (cur) {
      $('curMonth').textContent = monthLabel(cur.month);
      $('total').textContent = count(cur.total) + '명';
      $('newCus').textContent = '+' + count(cur.fresh) + '명';
      if (prev && prev.total) {
        const g = (cur.total - prev.total) / prev.total * 100;
        $('totalDelta').textContent = (g >= 0 ? '+' : '') + trimZero(g.toFixed(1)) + '%';
        $('totalDelta').className = g > 0 ? 'up' : '';
      } else $('totalDelta').textContent = '–';

      $('churn').textContent = fmtPct(cur.churn, 1);
      $('churnSub').innerHTML = prev ? deltaText(cur.churn - prev.churn, (v) => trimZero(v.toFixed(1)) + '%p', cur.churn < prev.churn) : '&nbsp;';
      $('ltv').textContent = moneyDetail(cur.ltv);
      $('ltv').title = fullWon(cur.ltv);
      $('ltvSub').innerHTML = prev ? deltaText(cur.ltv - prev.ltv, (v) => moneyDetail(v), cur.ltv > prev.ltv) : '&nbsp;';
    } else {
      ['curMonth', 'total', 'newCus', 'totalDelta', 'churn', 'ltv'].forEach((id) => ($(id).textContent = '–'));
      $('churnSub').textContent = '월별 고객 데이터 없음';
      $('ltvSub').innerHTML = '&nbsp;';
    }

    const six = state.repeat.find((r) => periodMonths(r.period) === 6);
    $('repeat6').textContent = six ? fmtPct(six.rate, 1) : '–';
    $('repeatBar').style.width = six ? Math.min(six.rate, 100) + '%' : '0';

    renderSparks();
  }

  // 작은 선그래프 (최근 6개월)
  function sparkline(id, values) {
    const el = $(id);
    if (values.length < 2) { el.innerHTML = ''; return; }
    const W = Math.max(el.clientWidth, 80), H = 36, p = 4;
    const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const x = (i) => p + (W - p * 2) * i / (values.length - 1);
    const y = (v) => p + (H - p * 2) * (1 - (v - min) / span);
    const pts = values.map((v, i) => [x(i), y(v)]);
    const last = pts[pts.length - 1];
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
      <path d="${pts.map((q, i) => (i ? 'L' : 'M') + q[0] + ',' + q[1]).join('')}" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${ORANGE}"/>
    </svg>`;
  }
  function renderSparks() {
    const recent = state.summary.slice(-6);
    sparkline('churnSpark', recent.map((r) => r.churn));
    sparkline('ltvSpark', recent.map((r) => r.ltv));
  }

  // ================= 2. 코호트 잔존율 표 =================
  function renderCohort() {
    const box = $('cohort');
    if (!state.cohort.length) { box.innerHTML = placeholder(); return; }

    // 유입 월 순서는 sort_order 순서대로
    const months = [];
    const map = {};
    state.cohort.forEach((r) => {
      const k = String(r.cohort).trim();
      if (!(k in map)) { map[k] = {}; months.push(k); }
      map[k][r.after] = r.retention;
    });

    // 가장 낮은 값 = 가장 연하게, 가장 높은 값 = 가장 진하게
    const vals = state.cohort.map((r) => r.retention).filter((v) => v != null);
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;

    let h = '<table class="cohort"><thead><tr><th>유입 월</th>';
    for (let a = 0; a <= 5; a++) h += `<th>M+${a}</th>`;
    h += '</tr></thead><tbody>';
    months.forEach((k) => {
      h += `<tr><td class="m">${esc(monthLabel(k))}</td>`;
      for (let a = 0; a <= 5; a++) {
        const v = map[k][a];
        if (v == null) { h += '<td class="c empty"></td>'; continue; }
        const t = (v - lo) / span;                              // 0~1
        const alpha = 0.16 + 0.74 * t;                          // 클수록 진하게 (빈칸보다는 항상 진하게)
        h += `<td class="c" style="background:rgba(27,30,34,${alpha.toFixed(3)});color:${alpha > 0.48 ? '#fff' : INK}" title="${esc(monthLabel(k))} 유입 · M+${a} 잔존 ${fmtPct(v, 1)}">${fmtPct(v, 0)}</td>`;
      }
      h += '</tr>';
    });
    h += '</tbody></table>';
    box.innerHTML = h;
  }

  // ================= 3. 매출 구성 도넛 =================
  function renderMix() {
    const box = $('mix');
    const segs = state.mix.filter((s) => s.revenue > 0);
    const totalRev = segs.reduce((a, s) => a + s.revenue, 0);
    if (!segs.length || !totalRev) { box.innerHTML = placeholder('매출 구성 데이터가 없어요'); return; }

    const cur = state.summary[state.summary.length - 1];
    const R = 70, SW = 24, C = 2 * Math.PI * R;
    let acc = 0;
    let rings = '';
    segs.forEach((s, i) => {
      const len = s.revenue / totalRev * C;
      const gap = segs.length > 1 ? Math.min(2, len / 2) : 0;
      rings += `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${SEG_COLORS[i % SEG_COLORS.length]}" stroke-width="${SW}"
        stroke-dasharray="${Math.max(len - gap, 0)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)">
        <title>${esc(s.segment)} ${fmtPct(s.revenue / totalRev * 100, 1)} · ${fullWon(s.revenue)}</title></circle>`;
      acc += len;
    });

    const legend = segs.map((s, i) => `
      <div class="mix-item">
        <i style="background:${SEG_COLORS[i % SEG_COLORS.length]}"></i>
        <span class="nm">${esc(s.segment)}</span>
        <span class="pc">${fmtPct(s.revenue / totalRev * 100, 1)}</span>
        <span class="amt">${won(s.revenue)}</span>
      </div>`).join('');

    box.innerHTML = `
      <div class="donut-wrap">
        <div class="donut">
          <svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="매출 구성 도넛 그래프">
            <circle cx="90" cy="90" r="${R}" fill="none" stroke="#eceef1" stroke-width="${SW}"/>
            ${rings}
            <text x="90" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="${INK}">${cur ? count(cur.total) : '–'}</text>
            <text x="90" y="106" text-anchor="middle" font-size="12" fill="#6b7178">전체 고객(명)</text>
          </svg>
        </div>
        <div class="mix">
          ${legend}
          <div class="ltv-box"><span>1인당 LTV</span><b>${cur ? moneyDetail(cur.ltv) : '–'}</b></div>
        </div>
      </div>`;
  }

  // ================= 4. 기간별 재구매율 =================
  function renderRepeat() {
    const box = $('repeat');
    const rows = state.repeat;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    let h = '<div class="rp">';
    rows.forEach((r) => {
      const hl = periodMonths(r.period) === 6;
      h += `<div class="rp-row${hl ? ' hl' : ''}">
        <span class="rp-label">${esc(periodLabel(r.period))}</span>
        <div class="rp-track"><span style="width:${Math.max(0, Math.min(r.rate, 100))}%"></span></div>
        <span class="rp-val">${fmtPct(r.rate, 1)}</span>
      </div>`;
    });
    h += '<div class="rp-axis"><span></span><div><span>0%</span><span>50%</span><span>100%</span></div><span></span></div>';
    h += '</div>';
    box.innerHTML = h;
  }

  // ================= 5. 월별 이탈률 선그래프 =================
  function niceStep(raw) {
    if (raw <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => n <= s) * p;
  }

  let churnWidth = 0;
  function renderChurn() {
    const box = $('churnChart');
    const rows = state.summary;
    if (!rows.length) { box.innerHTML = placeholder(); return; }

    const W = Math.max(box.clientWidth, 260);
    churnWidth = box.clientWidth;
    const H = W < 480 ? 220 : 250;
    const pad = { top: 24, right: 12, bottom: 30, left: 42 };
    const iw = W - pad.left - pad.right;
    const ih = H - pad.top - pad.bottom;

    const TICKS = 4;
    const step = niceStep(Math.max(...rows.map((r) => r.churn), CHURN_TARGET, 1) * 1.25 / TICKS);
    const yMax = step * TICKS;
    const y = (v) => pad.top + ih - (v / yMax) * ih;

    const n = rows.length;
    const slot = iw / n;
    const lastIdx = n - 1;
    const showAll = slot >= 50;
    const labelEvery = Math.max(1, Math.ceil(30 / slot));
    const cxOf = (i) => pad.left + slot * i + slot / 2;

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 이탈률 선그래프">`;
    for (let i = 0; i <= TICKS; i++) {
      const v = step * i, yy = y(v);
      s += `<line x1="${pad.left}" x2="${W - pad.right}" y1="${yy}" y2="${yy}" stroke="${i === 0 ? '#d3d7dc' : '#eef0f2'}"/>`;
      s += `<text x="${pad.left - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#9aa0a6">${trimZero(String(Math.round(v * 100) / 100))}%</text>`;
    }

    // 목표 점선
    const ty = y(CHURN_TARGET);
    s += `<line x1="${pad.left}" x2="${W - pad.right}" y1="${ty}" y2="${ty}" stroke="#4b5259" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s += `<text x="${pad.left + 4}" y="${ty + 15}" text-anchor="start" font-size="11" font-weight="700" fill="#4b5259" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">목표 ${fmtPct(CHURN_TARGET, 1)}</text>`;

    // 이탈률 선
    const pts = rows.map((r, i) => [cxOf(i), y(r.churn)]);
    s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ',' + p[1]).join('')}" fill="none" stroke="${INK}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    rows.forEach((r, i) => {
      const [px, py] = pts[i];
      const over = r.churn > CHURN_TARGET;     // 목표보다 높으면 주황 점
      const isCur = i === lastIdx;
      s += `<circle cx="${px}" cy="${py}" r="${isCur ? 5 : 4}" fill="${over ? ORANGE : '#fff'}" stroke="${over ? ORANGE : INK}" stroke-width="2"><title>${esc(monthLabel(r.month))} 이탈률 ${fmtPct(r.churn, 1)}</title></circle>`;
      if (showAll || isCur) {
        s += `<text x="${px}" y="${py - 11}" text-anchor="middle" font-size="11" font-weight="${isCur ? 800 : 600}" fill="${INK}" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${fmtPct(r.churn, 1)}</text>`;
      }
      if ((lastIdx - i) % labelEvery === 0) {
        s += `<text x="${px}" y="${H - 9}" text-anchor="middle" font-size="12" font-weight="${isCur ? 800 : 400}" fill="${isCur ? INK : '#6b7178'}">${esc(monthLabel(r.month))}</text>`;
      }
    });

    s += '</svg>';
    box.innerHTML = s;
  }

  // ================= 시작 =================
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (state.summary.length) {
        renderSparks();
        if ($('churnChart').clientWidth !== churnWidth) renderChurn();
      }
    }, 150);
  });
  $('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
